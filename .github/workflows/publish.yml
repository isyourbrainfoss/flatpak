name: Publish Flatpak repository

on:
  repository_dispatch:
    types: [app-updated]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild/re-import even if the source did not change
        type: boolean
        default: false
      app:
        description: Limit "force" to one app id (empty = all)
        required: false
        default: ''
  schedule:
    - cron: '17 4 * * 1'   # weekly safety net (Monday 04:17 UTC)
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flatpak-publish
  cancel-in-progress: false

env:
  SITE_URL: https://isyourbrainfoss.github.io/flatpak

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve sources
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          ONLY_APP: ${{ inputs.app }}
        run: |
          echo "Trigger: ${{ github.event_name }} ${{ toJSON(github.event.client_payload) }}"
          python3 tools/plan.py
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json

  build:
    needs: plan
    if: needs.plan.outputs.has_builds == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    name: build ${{ matrix.app }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
      - name: Build
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --arch=${{ matrix.arch }} --user --install-deps-from=flathub \
            --disable-rofiles-fuse --force-clean --default-branch=stable \
            --repo=repo build-dir ${{ matrix.manifest }}
          ostree --repo=repo refs
          tar -cf repo.tar repo
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app }}-${{ matrix.arch }}
          path: repo.tar
          retention-days: 3

  publish:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.build.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 flatpak ostree python3-yaml
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts
      - name: Download release bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bundles
          python3 - <<'PY'
          import json, subprocess
          for d in json.load(open("plan.json"))["downloads"]:
              pat = [d["asset"]] + ([d["sha256_asset"]] if d["sha256_asset"] else [])
              args = ["gh", "release", "download", d["tag"], "-R", d["repo"], "-D", "bundles", "--clobber"]
              for p in pat:
                  args += ["-p", p]
              subprocess.run(args, check=True)
              if d["sha256_asset"]:
                  subprocess.run(f"cd bundles && sha256sum -c {d['sha256_asset']}", shell=True, check=True)
          PY
          ls -la bundles artifacts || true
      - name: Import signing key
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: tools/import-key.sh
      - name: Assemble, sign, prune
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: tools/publish.sh
      - name: Remove signing key
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Deploy in its own job: it starts only after the publish job (and its
  # github-pages artifact upload) has fully finished, so deploy-pages sees the
  # finalized artifact. If deploy fails, "Re-run failed jobs" re-runs only this
  # job and reuses the same artifact instead of uploading a duplicate.
  deploy:
    needs: publish
    # always() is required: when no app needs a rebuild the build job is
    # skipped, and without it GitHub skips every job downstream of build,
    # even though publish (which has its own always()) succeeded.
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
