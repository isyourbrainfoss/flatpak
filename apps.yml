# Apps published to https://isyourbrainfoss.github.io/flatpak/ (remote name: isyourbrainfoss).
#
# source.type:
#   build   - this repo builds the app from its manifest at the newest GitHub release tag
#             (public repos only), on native x86_64 / aarch64 runners.
#   release - the app repo builds and attaches <id>-<arch>.flatpak bundles to a GitHub
#             release whose tag starts with tag_prefix; this repo imports and signs them.
# Nothing is signed outside this repo.
apps:
  - id: org.gator.Gator
    name: Gator
    summary: GTK4/Libadwaita frontend for croc secure file transfers
    homepage: https://github.com/isyourbrainfoss/gator
    icon: https://raw.githubusercontent.com/isyourbrainfoss/gator/master/data/org.gator.Gator.svg
    archs: [x86_64, aarch64]
    source:
      type: build
      repo: isyourbrainfoss/gator
      manifest: org.gator.Gator.devel.yml   # type: dir manifest, built from the checked-out tag

  - id: io.github.isyourbrainfoss.CakeWalletMobile
    name: Cake Wallet Mobile
    summary: Unofficial aarch64 build of Cake Wallet for Linux phones
    homepage: https://github.com/isyourbrainfoss/cake_wallet/tree/linux-arm64
    icon: https://raw.githubusercontent.com/isyourbrainfoss/cake_wallet/linux-arm64/assets/images/cakewallet_icon_180.png
    archs: [aarch64]
    source:
      type: release
      repo: isyourbrainfoss/cake_wallet
      tag_prefix: mobile-

  - id: io.github.isyourbrainfoss.ProtonPassGtk
    name: Proton Pass GTK
    summary: Unofficial adaptive GTK frontend for Proton Pass CLI
    homepage: https://github.com/isyourbrainfoss/proton-pass-gtk
    icon: https://raw.githubusercontent.com/isyourbrainfoss/proton-pass-gtk/main/data/icons/hicolor/scalable/apps/io.github.isyourbrainfoss.ProtonPassGtk.svg
    archs: [x86_64, aarch64]
    source:
      type: release
      repo: isyourbrainfoss/proton-pass-gtk
      tag_prefix: v

  - id: com.isyourbrainfoss.Progressor
    name: Progressor
    summary: Training app for the Tindeq Progressor force gauge
    homepage: https://github.com/isyourbrainfoss/Progressor
    icon: https://raw.githubusercontent.com/isyourbrainfoss/Progressor/main/flatpak/icons/hicolor/scalable/apps/com.isyourbrainfoss.Progressor.svg
    archs: [x86_64, aarch64]
    source:
      type: release
      repo: isyourbrainfoss/Progressor
      tag_prefix: continuous     # rolling release, updated on every push to main

  - id: com.isyourbrainfoss.Navigation
    name: Navigation
    summary: Simple multi-platform OSM navigation for Linux desktop and mobile
    homepage: https://github.com/isyourbrainfoss/navigation
    icon: https://raw.githubusercontent.com/isyourbrainfoss/navigation/main/flatpak/icons/hicolor/scalable/apps/com.isyourbrainfoss.Navigation.svg
    archs: [x86_64, aarch64]
    source:
      type: release
      repo: isyourbrainfoss/navigation
      tag_prefix: build-

  - id: com.isyourbrainfoss.Spectrogram
    name: Spectrogram
    summary: Live microphone spectrogram for Linux desktop and mobile
    homepage: https://github.com/isyourbrainfoss/spectrogram
    icon: https://raw.githubusercontent.com/isyourbrainfoss/spectrogram/main/flatpak/icons/hicolor/scalable/apps/com.isyourbrainfoss.Spectrogram.svg
    archs: [x86_64, aarch64]
    source:
      type: release
      repo: isyourbrainfoss/spectrogram
      tag_prefix: build-

  - id: com.flowlog.flowlog
    name: Flowlog
    summary: Personal coffee intelligence hub
    homepage: https://github.com/isyourbrainfoss/flowlog
    icon: https://raw.githubusercontent.com/isyourbrainfoss/flowlog/main/app/flowlog/assets/icon/app_icon.png
    archs: [x86_64, aarch64]
    source:
      type: release
      repo: isyourbrainfoss/flowlog
      tag_prefix: build-
